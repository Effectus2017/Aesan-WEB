<div class="flex flex-col -m-6 max-h-screen min-w-120">
  <div class="flex flex-shrink-0 justify-between items-center pr-3 pl-6 h-16 sm:pr-5 sm:pl-8 bg-primary text-on-primary">
    <div class="flex flex-col min-w-0">
      <div class="text-lg font-medium truncate">
        {{ 'sponsor-evaluation.agencyBoardMembersModal.title' | transloco }}
      </div>
      <div *ngIf="agencyName" class="text-sm opacity-90 truncate">{{ agencyName }}</div>
    </div>
    <button
      mat-icon-button
      [mat-dialog-close]="null"
      [tabIndex]="-1"
      [title]="'global.buttons.close' | transloco"
      [attr.aria-label]="'global.buttons.close' | transloco"
    >
      <mat-icon class="text-on-primary" [svgIcon]="'heroicons_outline:x-mark'" aria-hidden="true"></mat-icon>
    </button>
  </div>

  <div class="flex overflow-y-auto flex-col flex-auto p-6 min-h-0">
    <div *ngIf="isInitialLoading" class="flex flex-col gap-3 justify-center items-center py-8">
      <mat-icon class="icon-size-7 text-secondary">hourglass_empty</mat-icon>
      <div class="text-secondary">{{ 'global.loading' | transloco }}</div>
    </div>

    <div *ngIf="!isInitialLoading && tableConfig.length === 0" class="flex flex-col gap-2 items-center justify-center py-10 text-secondary">
      <mat-icon class="icon-size-8 opacity-60">groups</mat-icon>
      <div>{{ 'sponsor-evaluation.agencyBoardMembersModal.empty' | transloco }}</div>
    </div>

    <div *ngIf="!isInitialLoading && tableConfig.length > 0" class="flex-1 animate-slide-in">
      <app-generic-table [config]="tableConfig" [handler]="this" [darkMode]="false"></app-generic-table>
    </div>
  </div>

  <div
    class="flex flex-col flex-shrink-0 justify-between p-6 border-t border-gray-200 dark:border-gray-700 sm:flex-row sm:items-center"
  >
    <div class="flex gap-2">
      <button mat-flat-button type="button" [color]="'warn'" (click)="onClose()">
        {{ 'global.buttons.close' | transloco }}
      </button>
    </div>
  </div>
</div>
