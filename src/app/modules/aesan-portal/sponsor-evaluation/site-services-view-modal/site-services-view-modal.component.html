<div class="flex flex-col -m-6 max-h-[85vh] min-w-120">
  <!-- Header -->
  <div class="flex flex-shrink-0 justify-between items-center pr-3 pl-6 h-16 sm:pr-5 sm:pl-8 bg-primary text-on-primary">
    <div class="text-lg font-medium">
      {{ 'sponsor-evaluation.edit.sites.modal.services.title' | transloco }}
    </div>
    <button
      mat-icon-button
      type="button"
      (click)="onClose()"
      [tabIndex]="-1"
      [title]="'global.buttons.close' | transloco"
      [attr.aria-label]="'global.buttons.close' | transloco"
    >
      <mat-icon class="text-on-primary" [svgIcon]="'heroicons_outline:x-mark'" aria-hidden="true"></mat-icon>
    </button>
  </div>

  <div class="flex overflow-y-auto flex-col flex-auto p-6 min-h-0 bg-default">
    <div *ngIf="loadError" class="py-6 text-center text-warn">
      {{ 'sponsor-evaluation.edit.sites.modal.services.loadError' | transloco }}
    </div>

    <ng-container *ngIf="!loadError">
      <div class="grid grid-cols-1 col-span-12 gap-4 sm:grid-cols-1 sm:col-span-12">
        <div class="mb-4">
          <div *ngIf="!hasChildGroups" class="py-4 text-secondary">
            {{ 'sponsor-evaluation.edit.sites.modal.services.empty' | transloco }}
          </div>

          <div *ngIf="hasChildGroups" class="w-full min-h-0">
            <div *ngIf="servicesCardLoading" class="flex flex-col gap-3 justify-center items-center py-8">
              <mat-icon class="icon-size-7 text-secondary">hourglass_empty</mat-icon>
              <div class="text-secondary">{{ 'global.loading' | transloco }}</div>
            </div>
            <app-generic-table
              *ngIf="!servicesCardLoading"
              [config]="servicesTableConfig"
              [handler]="this"
            ></app-generic-table>
          </div>
        </div>
      </div>
    </ng-container>
  </div>

  <div
    class="flex flex-col flex-shrink-0 justify-between p-6 border-t border-gray-200 dark:border-gray-700 sm:flex-row sm:items-center"
  >
    <button mat-flat-button type="button" color="warn" (click)="onClose()">
      {{ 'global.buttons.close' | transloco }}
    </button>
  </div>
</div>
