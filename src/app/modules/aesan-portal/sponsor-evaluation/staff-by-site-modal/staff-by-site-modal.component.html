<div class="flex flex-col -m-6 max-h-screen min-w-120">
  <!-- Header: título + cerrar (mismo patrón que sites-by-school-view-modal / agency-board-members-modal) -->
  <div class="flex justify-between items-center gap-2 pr-2 pl-6 min-h-16 flex-0 sm:pr-4 sm:pl-8 bg-primary text-on-primary">
    <div class="flex flex-col min-w-0 flex-1 py-2">
      <div class="text-lg font-medium leading-tight truncate">
        {{
          (data.schoolName
            ? 'sponsor-evaluation.edit.staffBySite.modal.titleBySchool'
            : 'sponsor-evaluation.edit.staffBySite.modal.title'
          ) | transloco
        }}
      </div>
      <div *ngIf="data.schoolName" class="text-sm opacity-90 truncate">{{ data.schoolName }}</div>
    </div>
    <div class="flex flex-shrink-0 items-center">
      <button
        mat-icon-button
        [mat-dialog-close]="null"
        [tabIndex]="-1"
        [title]="'global.buttons.close' | transloco"
        [attr.aria-label]="'global.buttons.close' | transloco"
      >
        <mat-icon class="text-on-primary" [svgIcon]="'heroicons_outline:x-mark'" aria-hidden="true"></mat-icon>
      </button>
    </div>
  </div>

  <!-- Content - Scrollable area -->
  <div class="flex overflow-y-auto flex-col flex-auto p-6 min-h-0">
    <!-- Loading State -->
    <div *ngIf="isInitialLoading" class="flex flex-col items-center justify-center gap-3 py-8">
      <mat-icon class="icon-size-7 text-secondary">hourglass_empty</mat-icon>
      <div class="text-secondary">{{ "global.loading" | transloco }}</div>
    </div>

    <!-- Tabla de personal -->
    <div *ngIf="!isInitialLoading" class="flex-1 animate-slide-in">
      <app-generic-table
        [config]="tableConfig"
        [handler]="this"
        [darkMode]="false">
      </app-generic-table>
    </div>
  </div>

  <!-- Pie: Cerrar rojo a la izquierda (mismo patrón que sites-by-school-view-modal) -->
  <div
    class="flex flex-col flex-shrink-0 justify-between p-6 border-t border-gray-200 dark:border-gray-700 sm:flex-row sm:items-center"
  >
    <div class="flex gap-2">
      <button mat-flat-button type="button" [color]="'warn'" (click)="onClose()">
        {{ 'global.buttons.close' | transloco }}
      </button>
    </div>
  </div>
</div>
