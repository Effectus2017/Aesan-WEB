<div class="flex flex-col -m-6 max-h-screen min-w-100">
  <!-- Header -->
  <div class="flex justify-between items-center pr-3 pl-6 h-16 flex-0 sm:pr-5 sm:pl-8 bg-primary text-on-primary">
    <div class="text-lg font-medium">Agregar Cita</div>
    <button mat-icon-button (click)="onClose()" [tabIndex]="-1" title="Cerrar">
      <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
    </button>
  </div>

  <form class="flex flex-col flex-auto min-h-0" [formGroup]="form" (ngSubmit)="onSave()">
    <div class="flex overflow-y-auto flex-col flex-auto p-6">
      <div class="flex flex-col gap-6 animate-slide-in">
        
        <!-- Información del día -->
        <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-lg">
          <p class="text-sm text-gray-600 dark:text-gray-400">
            <strong>Fecha de la Cita:</strong> {{ getFormattedDate() }}
          </p>
        </div>

        <!-- Horarios -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <mat-form-field>
              <mat-label>Hora de Inicio</mat-label>
              <mat-select formControlName="startTime" required>
                <mat-option *ngFor="let time of timeOptions" [value]="time.value">
                  {{ time.display }}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="form.get('startTime').hasError('required')">Requerido</mat-error>
          </mat-form-field>
          <mat-form-field>
              <mat-label>Hora de Fin</mat-label>
              <mat-select formControlName="endTime" required>
                <mat-option *ngFor="let time of timeOptions" [value]="time.value">
                  {{ time.display }}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="form.get('endTime').hasError('required')">Requerido</mat-error>
          </mat-form-field>
        </div>

        <!-- Comentario -->
        <mat-form-field>
          <mat-label>Comentarios</mat-label>
          <textarea matInput formControlName="comment" rows="3"></textarea>
        </mat-form-field>

      </div>
    </div>

    <!-- Actions -->
    <div class="flex flex-col justify-between p-6 border-t border-gray-200 flex-shrink-0 dark:border-gray-700 sm:flex-row sm:items-center">
      <div class="flex gap-2">
        <button mat-flat-button type="button" [color]="'warn'" (click)="onClose()">Cancelar</button>
      </div>
      <button mat-flat-button type="submit" [color]="'primary'" [disabled]="form.invalid">Guardar</button>
    </div>
  </form>
</div>
