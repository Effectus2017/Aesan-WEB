<div class="flex flex-col flex-auto items-center min-w-0 sm:justify-center">
  <div class="flex fixed top-4 right-4 z-50 gap-2 items-center">
    <languages></languages>
  </div>
  <div class="px-4 py-8 w-full sm:w-auto sm:pl-12 sm:pr-12 sm:rounded-2xl sm:shadow sm:bg-card">
    <div class="mx-auto w-full max-w-80 sm:w-80 sm:mx-0">
      <div class="flex justify-center items-center mt-2">
        <img
          [src]="'assets/images/logo/logo.png'"
          alt="Logo"
          class="w-auto"
          fetchpriority="high"
          loading="eager"
          decoding="sync"
        />
      </div>

      <div class="mt-4 text-4xl font-extrabold tracking-tight leading-tight text-center">{{ 'select-role.title' | transloco }}</div>
      <div class="flex justify-center items-center mx-auto mt-1 font-medium text-center text-secondary">
        {{ 'select-role.subtitle' | transloco }}
      </div>

      <fuse-alert class="mt-8" *ngIf="showAlert" [appearance]="'outline'" [showIcon]="false" [type]="alert.type" [@shake]="alert.type === 'error'">
        <div class="flex flex-col gap-2">
          <span>{{ alert.message | transloco }}</span>
          <a routerLink="/sign-in" class="font-medium underline">{{ 'select-role.error.signInAgain' | transloco }}</a>
        </div>
      </fuse-alert>

      <div class="flex flex-col gap-3 mt-8">
        <mat-spinner *ngIf="isLoading" diameter="32" class="mx-auto"></mat-spinner>
        <mat-form-field *ngIf="!isLoading" class="w-full">
          <mat-label>{{ 'select-role.placeholder' | transloco }}</mat-label>
          <mat-select
            [disabled]="isLoading"
            (selectionChange)="selectRole($event.value)"
            [value]="selectedRole"
            [attr.data-cy]="'role-select'"
            [attr.aria-label]="'select-role.placeholder' | transloco"
          >
            <mat-option *ngFor="let role of roles" [value]="role.name" [attr.data-cy]="'role-' + role.name">
              {{ currentLang === 'es' ? role.displayName : role.displayNameEN }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </div>
</div>
