<div class="flex flex-col items-center flex-auto min-w-0 p-2 sm:justify-center">
  <div class="w-full px-4 py-8 sm:w-auto sm:p-12 sm:rounded-2xl sm:shadow sm:bg-card">
    <div class="w-full max-w-3xl mx-auto sm:mx-0">
      <!-- Título -->
      <div class="mt-8 text-4xl font-extrabold leading-tight tracking-tight">Aplicación al Programa</div>

      <!-- Formulario de registro -->
      <form class="mt-8" [formGroup]="signUpForm" #signUpNgForm="ngForm">
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
          <!-- Columna izquierda -->
          <div>
            <!-- Nombre de la Agencia Auspiciadora -->
            <mat-form-field class="w-full">
              <mat-label>Nombre de la Agencia Auspiciadora</mat-label>
              <input matInput [formControlName]="'agencyName'" />
            </mat-form-field>

            <!-- Nombre -->
            <mat-form-field class="w-full">
              <mat-label>Nombre</mat-label>
              <input matInput [formControlName]="'firstName'" />
            </mat-form-field>

            <!-- Apellido Materno -->
            <mat-form-field class="w-full">
              <mat-label>Apellido Materno</mat-label>
              <input matInput [formControlName]="'motherLastName'" />
            </mat-form-field>

            <!-- Teléfono -->
            <mat-form-field class="w-full">
              <mat-label>Teléfono</mat-label>
              <input matInput [formControlName]="'phone'" placeholder="(xxx) xxx-xxxx" />
            </mat-form-field>

            <!-- Organización sin fines de lucro -->
            <div class="flex items-center mt-4">
              <mat-checkbox [formControlName]="'nonProfit'" color="primary">¿Es usted una organización sin fines de lucro?</mat-checkbox>
            </div>
          </div>

          <!-- Columna derecha -->
          <div>
            <!-- UIE # -->
            <mat-form-field class="w-full">
              <mat-label>UIE #</mat-label>
              <input matInput [formControlName]="'uieNumber'" />
            </mat-form-field>

            <!-- Apellido Paterno -->
            <mat-form-field class="w-full">
              <mat-label>Apellido Paterno</mat-label>
              <input matInput [formControlName]="'lastName'" />
            </mat-form-field>

            <!-- Correo Electrónico -->
            <mat-form-field class="w-full">
              <mat-label>Correo Electrónico</mat-label>
              <input matInput [formControlName]="'email'" />
              <mat-error *ngIf="signUpForm.get('email').hasError('email')">Por favor, ingrese un correo electrónico válido</mat-error>
            </mat-form-field>

            <!-- Programa al que desea participar -->
            <mat-form-field class="w-full">
              <mat-label>Programa al que desea participar</mat-label>
              <mat-select [formControlName]="'program'">
                <mat-option value="PDAM">PDAM</mat-option>
                <mat-option value="PSAV">PSAV</mat-option>
                <mat-option value="PACNA">PACNA</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>

        <!-- Botón de envío -->
        <div class="flex justify-end mt-8">
          <button class="w-full sm:w-auto fuse-mat-button-large" mat-flat-button [color]="'primary'" [disabled]="signUpForm.disabled" (click)="signUp()">
            <span *ngIf="!signUpForm.disabled">Someter Registro</span>
            <mat-progress-spinner *ngIf="signUpForm.disabled" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
