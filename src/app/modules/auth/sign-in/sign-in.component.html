<div class="flex flex-col items-center flex-auto min-w-0 sm:justify-center">
  <div class="w-full px-4 py-8 sm:w-auto sm:pl-12 sm:pr-12 sm:rounded-2xl sm:shadow sm:bg-card">
    <div class="w-full mx-auto max-w-80 sm:w-80 sm:mx-0">
      <!-- Logo -->
      <div class="">
        <img src="assets/images/logo/logo.png" />
      </div>

      <!-- Título -->

      <div class="mt-4 text-4xl font-extrabold leading-tight tracking-tight text-center">Iniciar sesión</div>
      <div class="flex items-center justify-center mx-auto mt-1 font-medium text-center">
        <div>¿No tienes una cuenta?</div>
        <a class="ml-1 text-primary-500 hover:underline" [routerLink]="['/sign-up']">Regístrate </a>
      </div>

      <!-- Alerta -->
      <fuse-alert class="mt-8" *ngIf="showAlert" [appearance]="'outline'" [showIcon]="false" [type]="alert.type" [@shake]="alert.type === 'error'">
        {{ alert.message }}
      </fuse-alert>

      <!-- Formulario de inicio de sesión -->
      <form class="mt-8" [formGroup]="signInForm" #signInNgForm="ngForm">
        <!-- Campo de correo electrónico -->
        <mat-form-field class="w-full">
          <mat-label>Dirección de correo electrónico</mat-label>
          <input id="email" matInput [formControlName]="'email'" />
          <mat-error *ngIf="signInForm.get('email').hasError('required')"> La dirección de correo electrónico es obligatoria </mat-error>
          <mat-error *ngIf="signInForm.get('email').hasError('email')"> Por favor, introduce una dirección de correo electrónico válida </mat-error>
        </mat-form-field>

        <!-- Campo de contraseña -->
        <mat-form-field class="w-full">
          <mat-label>Contraseña</mat-label>
          <input id="password" matInput type="password" [formControlName]="'password'" #passwordField />
          <button mat-icon-button type="button" (click)="passwordField.type === 'password' ? (passwordField.type = 'text') : (passwordField.type = 'password')" matSuffix>
            <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'password'" [svgIcon]="'heroicons_solid:eye'"></mat-icon>
            <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'text'" [svgIcon]="'heroicons_solid:eye-slash'"></mat-icon>
          </button>
          <mat-error> La contraseña es obligatoria </mat-error>
        </mat-form-field>

        <!-- Acciones -->
        <div class="inline-flex items-center justify-between w-full mt-1.5">
          <mat-checkbox class="-ml-2" [color]="'primary'" [formControlName]="'rememberMe'"> Recordarme </mat-checkbox>
          <a class="font-medium text-md text-primary-500 hover:underline" [routerLink]="['/forgot-password']">¿Olvidaste tu contraseña? </a>
        </div>

        <!-- Botón de envío -->
        <button class="w-full mt-6 fuse-mat-button-large" mat-flat-button [color]="'primary'" [disabled]="signInForm.disabled" (click)="signIn()">
          <span *ngIf="!signInForm.disabled"> Iniciar sesión </span>
          <mat-progress-spinner *ngIf="signInForm.disabled" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
        </button>

      </form>
    </div>
  </div>
</div>
