<div class="flex flex-col items-center flex-auto min-w-0 sm:justify-center">
  <div class="w-full px-4 py-8 sm:w-auto sm:pl-12 sm:pr-12 sm:rounded-2xl sm:shadow sm:bg-card">
    <div class="w-full mx-auto max-w-80 sm:w-80 sm:mx-0">
      <!-- Logo -->
      <div class="">
        <img src="assets/images/logo/logo.png" alt="Logo" />
      </div>

      <!-- Title -->

      <div class="mt-4 text-4xl font-extrabold leading-tight tracking-tight text-center">Sign In</div>
      <div class="flex items-center justify-center mx-auto mt-1 font-medium text-center">
        <div>Don't have an account?</div>
        <a class="ml-1 text-primary-500 hover:underline" [routerLink]="['/sign-up']">Sign Up </a>
      </div>

      <!-- Alert -->
      <fuse-alert class="mt-8" *ngIf="showAlert" [appearance]="'outline'" [showIcon]="false" [type]="alert.type" [@shake]="alert.type === 'error'">
        {{ alert.message }}
      </fuse-alert>

      <!-- Sign In Form -->
      <form class="mt-8" [formGroup]="signInForm" #signInNgForm="ngForm">
        <!-- Email Field -->
        <mat-form-field class="w-full">
          <mat-label>Email Address</mat-label>
          <input id="email" matInput [formControlName]="'email'" placeholder="Enter your email" />
          <mat-error *ngIf="signInForm.get('email').hasError('required')"> Email address is required </mat-error>
          <mat-error *ngIf="signInForm.get('email').hasError('email')"> Please enter a valid email address </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field class="w-full">
          <mat-label>Password</mat-label>
          <input id="password" matInput type="password" [formControlName]="'password'" #passwordField placeholder="Enter your password" />
          <button mat-icon-button type="button" (click)="passwordField.type === 'password' ? (passwordField.type = 'text') : (passwordField.type = 'password')" matSuffix>
            <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'password'" [svgIcon]="'heroicons_solid:eye'"></mat-icon>
            <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'text'" [svgIcon]="'heroicons_solid:eye-slash'"></mat-icon>
          </button>
          <mat-error> Password is required </mat-error>
        </mat-form-field>

        <!-- Actions -->
        <div class="inline-flex items-center justify-between w-full mt-1.5">
          <mat-checkbox class="-ml-2" [color]="'primary'" [formControlName]="'rememberMe'"> Remember Me </mat-checkbox>
          <a class="font-medium text-md text-primary-500 hover:underline" [routerLink]="['/forgot-password']">Forgot Your Password? </a>
        </div>

        <!-- Submit Button -->
        <button class="w-full mt-6 fuse-mat-button-large" mat-flat-button [color]="'primary'" [disabled]="signInForm.disabled" (click)="signIn()">
          <span *ngIf="!signInForm.disabled"> Sign In </span>
          <mat-progress-spinner *ngIf="signInForm.disabled" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
        </button>

      </form>
    </div>
  </div>
</div>
