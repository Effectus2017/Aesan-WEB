<div class="absolute inset-0 flex flex-col min-w-0">
  <app-generic-header
    [config]="headerConfig"
    [handler]="this"
  ></app-generic-header>
  <div class="flex-auto overflow-y-auto sm:p-6 sm:w-auto" cdkScrollable>
    <form [formGroup]="headerConfig.formGroup">
      <!-- Campos del formulario para HouseholdMember -->
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Application ID</mat-label>
        <input matInput formControlName="applicationId" type="number" required placeholder="ID de la solicitud" title="ID de la solicitud" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="firstName" required placeholder="Nombre" title="Nombre" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Segundo Nombre</mat-label>
        <input matInput formControlName="middleName" placeholder="Segundo Nombre" title="Segundo Nombre" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Apellido Paterno</mat-label>
        <input matInput formControlName="fatherLastName" required placeholder="Apellido Paterno" title="Apellido Paterno" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Apellido Materno</mat-label>
        <input matInput formControlName="motherLastName" required placeholder="Apellido Materno" title="Apellido Materno" />
      </mat-form-field>
      <mat-checkbox formControlName="isStudent">¿Es estudiante?</mat-checkbox>
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>ID Escuela</mat-label>
        <input matInput formControlName="schoolId" type="number" placeholder="ID de la escuela" title="ID de la escuela" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Grado</mat-label>
        <input matInput formControlName="grade" placeholder="Grado" title="Grado" />
      </mat-form-field>
      <mat-checkbox formControlName="isFoster">¿Es niño en cuidado adoptivo?</mat-checkbox>
      <mat-checkbox formControlName="isMigrant">¿Es migrante?</mat-checkbox>
      <mat-checkbox formControlName="isHomeless">¿Está sin hogar?</mat-checkbox>
      <mat-checkbox formControlName="isRunaway">¿Es fugitivo?</mat-checkbox>
      <mat-checkbox formControlName="isActive">Activo</mat-checkbox>
    </form>
  </div>
</div>
