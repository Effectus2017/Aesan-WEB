<div class="flex overflow-hidden absolute inset-0 flex-col min-w-0">
  <!-- Header con título -->
  <app-generic-header [config]="headerConfig" [handler]="this"></app-generic-header>

  <!-- Main Content -->
  <div class="overflow-y-auto flex-auto" cdkScrollable>
    <div class="p-6 sm:p-10">
      <!-- Sección de KPIs -->
      <div class="grid grid-cols-1 gap-6 mb-8 sm:grid-cols-3">
        <ng-container *ngFor="let card of agencyDashboardCardsData">
          <div class="p-6 bg-white rounded-lg border border-gray-200 shadow-sm transition-shadow hover:shadow-md">
            <div class="mb-2 text-sm font-medium text-gray-600">
              {{ card.title | transloco }}
            </div>
            <div class="text-4xl font-bold" [ngClass]="card.color">
              {{ card.value }}
            </div>
          </div>
        </ng-container>
      </div>

      <!-- Sección de Gráficos -->
      <div class="grid grid-cols-1 gap-6 mb-8 lg:grid-cols-2">
        <!-- Gráfico de Raciones por Mes -->
        <div class="p-6 bg-white rounded-lg border border-gray-200 shadow-sm">
          <apx-chart
            [series]="rationsChartOptions.series"
            [chart]="rationsChartOptions.chart"
            [plotOptions]="rationsChartOptions.plotOptions"
            [dataLabels]="rationsChartOptions.dataLabels"
            [xaxis]="rationsChartOptions.xaxis"
            [yaxis]="rationsChartOptions.yaxis"
            [colors]="rationsChartOptions.colors"
            [title]="rationsChartOptions.title">
          </apx-chart>
        </div>

        <!-- Gráfico de Visitas Coordinadas -->
        <div class="p-6 bg-white rounded-lg border border-gray-200 shadow-sm">
          <apx-chart
            [series]="visitsChartOptions.series"
            [chart]="visitsChartOptions.chart"
            [labels]="visitsChartOptions.labels"
            [dataLabels]="visitsChartOptions.dataLabels"
            [colors]="visitsChartOptions.colors"
            [legend]="visitsChartOptions.legend"
            [title]="visitsChartOptions.title">
          </apx-chart>
        </div>
      </div>

      <!-- Tabla de Formularios -->
      <div class="mb-8">
        <h2 class="mb-4 text-xl font-bold text-gray-800">
          {{ 'agency.dashboard.table.title' | transloco }}
        </h2>
        <app-generic-table [config]="tableConfig" [handler]="this"></app-generic-table>
      </div>
    </div>
  </div>
</div>
