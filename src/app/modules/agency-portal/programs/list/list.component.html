<div class="flex flex-col flex-auto min-w-0">

    <!-- Main -->
    <div class="flex-auto p-6 sm:p-10">

        <!-- Grid de tarjetas -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

            <!-- Tarjeta dinámica -->
            <div *ngFor="let program of programs">
            <div *ngFor="let program of programs" class="flex flex-col overflow-hidden bg-white shadow-md rounded-xl">
                <div class="p-6">
                    <div class="flex items-center mb-4">
                        <img class="w-16 h-16 mr-4 rounded-lg" [src]="program.icon" [alt]="program.title" />
                        <h3 class="text-xl font-semibold text-gray-900">{{program.title}}</h3>
                    </div>
                    <div class="space-y-4">
                        <div *ngFor="let question of program.questions">
                            <h4 class="mb-2 text-lg font-medium text-gray-900">{{question.title}}</h4>
                            <p class="text-gray-600">{{question.answer}}</p>
                        </div>
                    </div>
                </div>
                <div class="px-6 pb-4">
                    <button class="w-full px-4 py-2 text-white transition-colors rounded-lg bg-primary hover:bg-primary-600">
                        Leer más
                    </button>
                </div>
            </div>

        </div>

    </div>

</div>
