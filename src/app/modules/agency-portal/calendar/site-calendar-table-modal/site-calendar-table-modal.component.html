<div class="flex flex-col -m-6 max-h-screen min-w-120" [appKeyboardShortcut]="null" [compatibilityMode]="true">
  <!-- Header -->
  <div class="flex justify-between items-center pr-3 pl-6 h-16 flex-0 sm:pr-5 sm:pl-8 bg-primary text-on-primary">
    <div class="text-lg font-medium">
      {{ 'sites.calendar.modals.day-events.title' | transloco }}: {{ data.date | date:'dd/MM/yyyy' }}
    </div>
    <button mat-icon-button [mat-dialog-close]="null" [tabIndex]="-1" [title]="'global.buttons.close' | transloco" [attr.aria-label]="'global.buttons.close' | transloco">
      <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x-mark'" aria-hidden="true"></mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="flex overflow-y-auto flex-col flex-auto min-h-0 p-6">
    <div class="flex flex-col gap-6 animate-slide-in">
      <!-- Información del día -->
      <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-lg">
        <p class="text-sm text-gray-600 dark:text-gray-400">
          <strong>{{ 'sites.calendar.modals.day-events.totalEvents' | transloco }}:</strong> {{ totalEvents }}
        </p>
      </div>

      <!-- Tabla de eventos -->
      <div class="flex-1">
        <app-generic-table
          [config]="data.tableConfig"
          [handler]="data.handler"
          [darkMode]="false">
        </app-generic-table>
      </div>
    </div>
  </div>

  <!-- Actions - Fixed footer, outside scroll -->
  <div class="flex flex-col justify-between p-6 border-t border-gray-200 flex-shrink-0 dark:border-gray-700 sm:flex-row sm:items-center">
    <div class="flex gap-2">
      <button mat-flat-button type="button" [color]="'warn'" [mat-dialog-close]="null">
        {{ 'global.buttons.close' | transloco }}
      </button>
    </div>
    <div class="flex gap-2">
      <button
        #addServiceButton
        data-add-service-button
        mat-flat-button
        type="button"
        [color]="'primary'"
        [disabled]="isHolidayDay() || !hasChildGroups()"
        [title]="getAddServiceButtonTitle()"
        [appDisableIfAgencyRestricted]="true"
        (click)="addService()">
        {{ 'sites.calendar.modals.day-events.addService' | transloco }}
      </button>
      <button
        #addEventButton
        data-add-event-button
        *ngIf="!hasOperatingDay()"
        mat-flat-button
        type="button"
        [color]="'primary'"
        [appDisableIfAgencyRestricted]="true"
        (click)="addEvent()">
        {{ 'sites.calendar.modals.day-events.addEvent' | transloco }}
      </button>
    </div>
  </div>
</div>
