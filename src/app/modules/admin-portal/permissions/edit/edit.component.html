<div class="absolute inset-0 flex flex-col min-w-0">
  <!-- Header con título y botones -->
  <app-generic-header [config]="headerConfig" [handler]="this"></app-generic-header>

  <div class="flex-auto overflow-y-auto sm:p-6 sm:w-auto" cdkScrollable>
    <form [formGroup]="headerConfig.formGroup">
      <div class="grid grid-cols-12 gap-2 p-4 sm:pt-0">
        <div class="grid grid-cols-1 col-span-12 gap-4 sm:grid-cols-2 sm:col-span-8">
          <mat-form-field>
            <mat-label>{{ 'permissions.edit.form.name' | transloco }}</mat-label>
            <input matInput formControlName="name" maxlength="100" required />
            <mat-error *ngIf="headerConfig.formGroup.get('name')?.hasError('required')">{{ 'permissions.edit.form.name_required' | transloco }}</mat-error>
          </mat-form-field>

          <mat-form-field>
            <mat-label>{{ 'permissions.edit.form.description' | transloco }}</mat-label>
            <input matInput formControlName="description" maxlength="255" required />
            <mat-error *ngIf="headerConfig.formGroup.get('description')?.hasError('required')">{{ 'permissions.edit.form.description_required' | transloco }}</mat-error>
          </mat-form-field>
        </div>
      </div>
    </form>
  </div>
</div>
