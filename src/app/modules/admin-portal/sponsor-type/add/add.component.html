<div class="absolute inset-0 flex flex-col min-w-0">
  <app-generic-header [config]="headerConfig" [handler]="this"></app-generic-header>
  <div class="flex-auto overflow-y-auto sm:p-6 sm:w-auto" cdkScrollable>
    <form [formGroup]="headerConfig.formGroup">
      <div class="grid grid-cols-12 gap-2 p-4 sm:pt-0">
        <div class="grid grid-cols-1 col-span-12 gap-4 sm:grid-cols-2 sm:col-span-8">
          <mat-form-field appearance="fill">
            <mat-label>{{ 'sponsor-type.add.name' | transloco }}</mat-label>
            <input matInput formControlName="name" required placeholder="{{ 'sponsor-type.add.name-placeholder' | transloco }}" />
            <mat-error *ngIf="headerConfig.formGroup.get('name').hasError('required')">{{ 'sponsor-type.add.name-error' | transloco }}</mat-error>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>{{ 'sponsor-type.add.nameEN' | transloco }}</mat-label>
            <input matInput formControlName="nameEN" required placeholder="{{ 'sponsor-type.add.nameEN-placeholder' | transloco }}" />
            <mat-error *ngIf="headerConfig.formGroup.get('nameEN').hasError('required')">{{ 'sponsor-type.add.nameEN-error' | transloco }}</mat-error>
          </mat-form-field>
        </div>
        <div class="col-span-12 sm:col-span-4 flex flex-col gap-4">
          <mat-form-field appearance="fill">
            <mat-label>{{ 'sponsor-type.add.position' | transloco }}</mat-label>
            <mat-select formControlName="position">
              <mat-option *ngFor="let option of positionOptions" [value]="option.value">{{ option.label }}</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-checkbox formControlName="isActive">{{ 'sponsor-type.add.isActive' | transloco }}</mat-checkbox>
        </div>
      </div>
    </form>
  </div>
</div>
