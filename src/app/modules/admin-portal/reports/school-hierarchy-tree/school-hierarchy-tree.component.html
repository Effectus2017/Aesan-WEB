<div class="w-full h-full flex flex-col bg-gray-50">
  <!-- Header con controles -->
  <div class="bg-white border-b border-gray-200 p-6">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold text-gray-800">
        {{ 'reports.school-hierarchy-tree.title' | transloco }}
      </h1>
    </div>

    <!-- Filtros -->
    <div class="flex gap-4 items-end">
      <!-- Selector de Año -->
      <div class="flex-1 max-w-xs">
        <label for="year-select" class="block text-sm font-medium text-gray-700 mb-2">
          {{ 'reports.school-hierarchy-tree.year' | transloco }}
        </label>
        <select
          id="year-select"
          [(ngModel)]="selectedYear"
          (change)="onYearChange()"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option *ngFor="let year of availableYears" [value]="year">
            {{ year }}
          </option>
        </select>
      </div>

      <!-- Selector de Auspiciador -->
      <div class="flex-1 max-w-xs">
        <label for="sponsor-select" class="block text-sm font-medium text-gray-700 mb-2">
          {{ 'reports.school-hierarchy-tree.sponsor' | transloco }}
        </label>
        <select
          id="sponsor-select"
          [(ngModel)]="selectedSponsorId"
          (change)="onSponsorChange()"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option [value]="undefined">{{ 'reports.school-hierarchy-tree.all-sponsors' | transloco }}</option>
          <option *ngFor="let agency of agencies" [value]="agency.id">
            {{ agency.name }}
          </option>
        </select>
      </div>
    </div>
  </div>

  <!-- Contenedor del diagrama -->
  <div class="flex-1 overflow-auto bg-white p-6">
    <!-- Loading state -->
    <div *ngIf="loading" class="flex items-center justify-center h-full">
      <div class="flex flex-col items-center gap-3">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        <p class="text-gray-600">{{ 'reports.school-hierarchy-tree.loading' | transloco }}</p>
      </div>
    </div>

    <!-- Error state -->
    <div *ngIf="error && !loading" class="flex items-center justify-center h-full">
      <div class="text-center">
        <div class="text-red-500 text-6xl mb-4">⚠️</div>
        <h3 class="text-lg font-semibold text-gray-800 mb-2">
          {{ 'reports.school-hierarchy-tree.error-title' | transloco }}
        </h3>
        <p class="text-gray-600 mb-4">{{ error }}</p>
        <button
          (click)="loadHierarchy()"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
          {{ 'reports.school-hierarchy-tree.retry' | transloco }}
        </button>
      </div>
    </div>

    <!-- Diagrama -->
    <div
      *ngIf="!loading && !error && hierarchyData"
      #treeContainer
      id="treeContainer"
      class="w-full h-full min-h-[600px] border border-gray-200 rounded-lg bg-white">
    </div>
  </div>
</div>
