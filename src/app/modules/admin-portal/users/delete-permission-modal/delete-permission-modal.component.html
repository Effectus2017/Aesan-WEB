<div class="flex flex-col -m-6 max-h-screen min-w-120">
  <!-- Header -->
  <div class="flex justify-between items-center pr-3 pl-6 h-16 flex-0 sm:pr-5 sm:pl-8 bg-primary text-on-primary">
    <div class="text-lg font-medium">{{ 'users.permission.modal.delete.title' | transloco }}</div>
    <button mat-icon-button (click)="onCancel()" [tabIndex]="-1" [title]="'global.buttons.close' | transloco">
      <mat-icon class="text-current">close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="flex overflow-y-auto flex-col flex-auto min-h-0 p-6">
    <div class="flex flex-col gap-6">
      <!-- Description -->
      <p class="text-secondary">
        {{ 'users.permission.modal.delete.description' | transloco: {
          userName: data.userName,
          permissionName: data.permission.name
        } }}
      </p>
    </div>
  </div>

  <!-- Actions - Fixed footer, outside scroll -->
  <div class="flex flex-col justify-between p-6 border-t border-gray-200 flex-shrink-0 dark:border-gray-700 sm:flex-row sm:items-center">
    <div class="flex gap-2">
      <button
        mat-button
        type="button"
        (click)="onCancel()"
        [disabled]="isLoading"
        data-cy="cancel-button"
      >
        {{ 'global.buttons.cancel' | transloco }}
      </button>
    </div>
    <button
      mat-flat-button
      color="warn"
      type="button"
      [disabled]="isLoading"
      (click)="onDelete()"
      data-cy="delete-button"
    >
      {{ "global.buttons.delete" | transloco }}
    </button>
  </div>
</div>
