<!-- Button -->
<button
    mat-icon-button
    [matMenuTriggerFor]="userActions">
    <img
        class="w-7 h-7 rounded-full"
        *ngIf="showAvatar && user.avatar"
        [lazyImg]="user.avatar | optimizeImage:100"
        [src]="user.avatar | optimizeImage:100"
    />
    <mat-icon
        *ngIf="!showAvatar || !user.avatar"
        [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
    <span
      class="absolute right-0 bottom-0 w-2 h-2 rounded-full"
      [ngClass]="{
        'mr-px mb-px': !showAvatar || !user.avatar,
        'bg-green-500': user.status === 'online',
        'bg-amber-500': user.status === 'away',
        'bg-red-500': user.status === 'busy',
        'bg-gray-400': user.status === 'not-visible'
      }"
    ></span>
</button>

<mat-menu [xPosition]="'before'" class="w-56" #userActions="matMenu">
  <button mat-menu-item>
    <span class="flex flex-col leading-none">
      <span>{{ 'common.signed-in-as' | transloco }}</span>
      <span class="mt-1.5 font-medium text-md">{{ user.email }}</span>
    </span>
  </button>
  <mat-divider class="my-2"></mat-divider>
  <button mat-menu-item (click)="navigateToProfile()">
    <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
    <span>{{ 'common.profile' | transloco }}</span>
  </button>
  <theme-toggle [menuItem]="true"></theme-toggle>
  <mat-divider class="my-2"></mat-divider>
  <button mat-menu-item (click)="signOut()">
    <mat-icon [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"></mat-icon>
    <span>Sign out</span>
  </button>
</mat-menu>

<mat-menu class="user-status-menu" #userStatus="matMenu">
  <button mat-menu-item (click)="updateUserStatus('online')">
    <span class="mr-3 w-4 h-4 bg-green-500 rounded-full"></span>
    <span>Online</span>
  </button>
  <button mat-menu-item (click)="updateUserStatus('away')">
    <span class="mr-3 w-4 h-4 bg-amber-500 rounded-full"></span>
    <span>Away</span>
  </button>
  <button mat-menu-item (click)="updateUserStatus('busy')">
    <span class="mr-3 w-4 h-4 bg-red-500 rounded-full"></span>
    <span>Busy</span>
  </button>
  <button mat-menu-item (click)="updateUserStatus('not-visible')">
    <span class="mr-3 w-4 h-4 bg-gray-400 rounded-full"></span>
    <span>Invisible</span>
  </button>
</mat-menu>
