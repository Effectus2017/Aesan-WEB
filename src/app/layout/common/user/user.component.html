<!-- Button -->
<button
    mat-icon-button
    [matMenuTriggerFor]="userActions">
    <img
        class="w-7 h-7 rounded-full"
        *ngIf="showAvatar && user.avatar"
        [lazyImg]="user.avatar | optimizeImage:100"
        [src]="user.avatar | optimizeImage:100"
    />
    <mat-icon
        *ngIf="!showAvatar || !user.avatar"
        [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
    <span
      class="absolute right-0 bottom-0 w-2 h-2 rounded-full"
      [ngClass]="{
        'mr-px mb-px': !showAvatar || !user.avatar,
        'bg-green-500': user.status === 'online',
        'bg-amber-500': user.status === 'away',
        'bg-red-500': user.status === 'busy',
        'bg-gray-400': user.status === 'not-visible'
      }"
    ></span>
</button>

<mat-menu [xPosition]="'before'" class="min-w-[18rem] w-max" #userActions="matMenu">
  <div class="flex items-center gap-3 px-3 py-2 min-h-[48px] cursor-default" [matTooltip]="user.email">
    <mat-icon [svgIcon]="'heroicons_outline:envelope'" class="text-gray-500 dark:text-gray-400 shrink-0"></mat-icon>
    <span class="flex-1">{{ user.email }}</span>
  </div>
  <mat-divider class="my-2"></mat-divider>
  <ng-container *ngIf="user?.role">
    <div class="flex items-center gap-3 px-3 py-2 min-h-[48px] cursor-default">
      <mat-icon [svgIcon]="'heroicons_outline:identification'" class="text-gray-500 dark:text-gray-400 shrink-0"></mat-icon>
      <span class="flex-1">{{ user.role }}</span>
    </div>
  </ng-container>
  <mat-divider class="my-2" *ngIf="user?.role"></mat-divider>
  <ng-container *ngIf="programsDisplay">
    <div class="flex items-center gap-3 px-3 py-2 min-h-[48px] cursor-default">
      <mat-icon [svgIcon]="'heroicons_outline:academic-cap'" class="text-gray-500 dark:text-gray-400 shrink-0"></mat-icon>
      <span class="flex-1 text-sm text-gray-600 dark:text-gray-300">{{ programsDisplay }}</span>
    </div>
  </ng-container>
  <mat-divider class="my-2" *ngIf="programsDisplay"></mat-divider>
  <ng-container *ngIf="userAgency">
    <div class="flex items-center gap-3 px-3 py-2 min-h-[48px] cursor-default">
      <mat-icon [svgIcon]="'heroicons_outline:building-office-2'" class="text-gray-500 dark:text-gray-400 shrink-0"></mat-icon>
      <span class="flex-1 truncate">{{ userAgency }}</span>
    </div>
  </ng-container>
  <mat-divider class="my-2" *ngIf="userAgency"></mat-divider>
  <ng-container *ngIf="availableRoles.length > 1">
    <button mat-menu-item [matMenuTriggerFor]="switchRoleMenu">
      <mat-icon [svgIcon]="'heroicons_outline:arrows-right-left'"></mat-icon>
      <span>{{ 'common.switch-role' | transloco }}</span>
    </button>
    <mat-menu #switchRoleMenu="matMenu" class="user-switch-role-menu">
      <button mat-menu-item *ngFor="let r of availableRoles" (click)="switchRole(r)" [disabled]="r === user?.role">
        <span>{{ r }}</span>
      </button>
    </mat-menu>
  </ng-container>
  <ng-container *ngIf="availableRoles.length <= 1">
    <span [matTooltip]="'common.single-role-tooltip' | transloco">
      <button mat-menu-item disabled>
        <mat-icon [svgIcon]="'heroicons_outline:arrows-right-left'"></mat-icon>
        <span>{{ 'common.switch-role' | transloco }}</span>
      </button>
    </span>
  </ng-container>
  <mat-divider class="my-2"></mat-divider>
  <button mat-menu-item (click)="navigateToProfile()">
    <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
    <span>{{ 'common.profile' | transloco }}</span>
  </button>
  <theme-toggle [menuItem]="true"></theme-toggle>
  <keyboard-shortcuts [menuItem]="true"></keyboard-shortcuts>
  <mat-divider class="my-2"></mat-divider>
  <button mat-menu-item (click)="signOut()">
    <mat-icon [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"></mat-icon>
    <span>{{ 'common.sign-out' | transloco }}</span>
  </button>
</mat-menu>

<mat-menu class="user-status-menu" #userStatus="matMenu">
  <button mat-menu-item (click)="updateUserStatus('online')">
    <span class="mr-3 w-4 h-4 bg-green-500 rounded-full"></span>
    <span>Online</span>
  </button>
  <button mat-menu-item (click)="updateUserStatus('away')">
    <span class="mr-3 w-4 h-4 bg-amber-500 rounded-full"></span>
    <span>Away</span>
  </button>
  <button mat-menu-item (click)="updateUserStatus('busy')">
    <span class="mr-3 w-4 h-4 bg-red-500 rounded-full"></span>
    <span>Busy</span>
  </button>
  <button mat-menu-item (click)="updateUserStatus('not-visible')">
    <span class="mr-3 w-4 h-4 bg-gray-400 rounded-full"></span>
    <span>Invisible</span>
  </button>
</mat-menu>
