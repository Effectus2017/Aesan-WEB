<!-- Custom Shortcuts toggle -->
<button
    mat-icon-button
    (click)="openPanel()"
    #customShortcutsOrigin>
    <mat-icon [svgIcon]="'heroicons_outline:squares-plus'"></mat-icon>
</button>

<!-- Custom Shortcuts panel -->
<ng-template #customShortcutsPanel>
    <div class="fixed inset-0 sm:static sm:inset-auto flex flex-col sm:min-w-90 sm:w-90 sm:rounded-2xl overflow-hidden shadow-lg">

        <!-- Header -->
        <div class="flex shrink-0 items-center py-4 pr-4 pl-6 bg-primary text-on-primary">
            <div class="sm:hidden -ml-1 mr-3">
                <button
                    mat-icon-button
                    (click)="closePanel()">
                    <mat-icon
                        class="icon-size-5 text-current"
                        [svgIcon]="'heroicons_solid:x-mark'"></mat-icon>
                </button>
            </div>
            <div class="flex items-center text-lg font-medium leading-10">
                <span>{{ 'navigation.shortcuts' | transloco }}</span>
            </div>
        </div>

        <!-- Content -->
        <div class="relative flex flex-col flex-auto sm:max-h-120 -mb-px overflow-y-auto bg-card">
                <!-- Shortcuts -->
                <div class="grid grid-cols-2 grid-flow-row">
                    <!-- Shortcut -->
                    <div 
                        *ngIf="showCompleteButton"
                        class="relative group flex flex-col overflow-hidden bg-card border-r border-b even:border-r-0 hover:bg-gray-50 dark:hover:bg-black dark:hover:bg-opacity-5">
                        <button
                            class="flex flex-col items-center justify-center w-full h-full py-6 no-underline border-0 bg-transparent cursor-pointer"
                            [disabled]="sending || isRegistrationCompleted"
                            (click)="sendTestMessage()">
                            <div class="relative flex shrink-0 items-center justify-center w-12 h-12 mb-3 rounded-full bg-gray-100 dark:bg-gray-700">
                                <mat-icon
                                    class="z-10"
                                    [svgIcon]="sending ? 'heroicons_outline:arrow-path' : 'heroicons_outline:check-circle'"></mat-icon>
                            </div>
                            <div class="font-medium text-center">{{ sending ? 'Enviando...' : 'Completar' }}</div>
                            <div class="text-md text-center text-secondary">Completar registro de Auspiciador</div>
                        </button>
                    </div>
                </div>
        </div>
    </div>
</ng-template>
