<!-- Button -->
<button
    mat-icon-button
    [matMenuTriggerFor]="languages"
    [attr.aria-label]="'Select language'"
    [title]="'Select language'">
    <ng-container *ngTemplateOutlet="flagImage; context: {$implicit: activeLang || 'en'}"></ng-container>
</button>

<!-- Language menu -->
<mat-menu
    [xPosition]="'before'"
    #languages="matMenu">
    <ng-container *ngFor="let lang of availableLangs; trackBy: trackByFn">
        <button
            mat-menu-item
            (click)="setActiveLang(lang.id)">
            <span class="flex items-center">
                <ng-container *ngTemplateOutlet="flagImage; context: {$implicit: lang?.id || 'en'}"></ng-container>
                <span class="ml-3">{{lang.label}}</span>
            </span>
        </button>
    </ng-container>
</mat-menu>

<!-- Flag image template -->
<ng-template
    let-lang
    #flagImage>
    <span class="relative w-6 shadow rounded-sm overflow-hidden">
        <span class="absolute inset-0 ring-1 ring-inset ring-black ring-opacity-10"></span>
        <img
            class="w-full"
            [src]="'assets/images/flags/' + (lang && flagCodes && flagCodes[lang] ? flagCodes[lang].toUpperCase() : 'us') + '.svg'"
            [alt]="'Flag image for ' + (lang || 'en')"
            [title]="'Flag for ' + (lang || 'en')">
    </span>
</ng-template>
