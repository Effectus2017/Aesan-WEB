<div class="flex flex-col -m-6 max-h-screen min-w-120">
  <!-- Header -->
  <div class="flex justify-between items-center pr-3 pl-6 h-16 flex-0 sm:pr-5 sm:pl-8 bg-primary text-on-primary">
    <div class="text-lg font-medium">{{ data.message.title || ('messages.detail.noTitle' | transloco) }}</div>
    <button mat-icon-button [mat-dialog-close]="null" [tabIndex]="-1" [title]="'global.buttons.close' | transloco" [attr.aria-label]="'global.buttons.close' | transloco">
      <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x-mark'" aria-hidden="true"></mat-icon>
    </button>
  </div>

  <!-- Content - Scrollable area -->
  <div class="flex overflow-y-auto flex-col flex-auto p-6 min-h-0">
    <div class="flex flex-col gap-6">
      <!-- Date -->
      <div class="text-sm text-secondary">
        {{ data.message.time | date:'MMM dd, yyyy h:mm a' }}
      </div>

      <!-- Description -->
      <div class="text-base whitespace-pre-wrap" [innerHTML]="data.message.description || ('messages.detail.noDescription' | transloco)"></div>
    </div>
  </div>

  <!-- Actions - Fixed footer, outside scroll -->
  <div class="flex flex-col flex-shrink-0 justify-end p-3 border-t border-gray-200 dark:border-gray-700 sm:flex-row sm:items-center">
    <div class="flex gap-3 w-full sm:justify-between">
      <button mat-flat-button type="button" [color]="'warn'" (click)="delete()">
        {{ 'global.buttons.delete' | transloco }}
      </button>
      <button mat-flat-button type="button" [color]="'primary'" (click)="close()">
        {{ 'global.buttons.close' | transloco }}
      </button>
    </div>
  </div>
</div>
