<!-- Deadline Banner -->
<div
    *ngIf="showBanner"
    [class]="'flex items-center px-3 py-1.5 rounded-lg shadow-sm cursor-pointer hover:opacity-80 transition-opacity ' + (isUrgent ? 'bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800' : 'bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800')"
    [matTooltip]="tooltipText"
    matTooltipPosition="below"
    (click)="onBannerClick()">

    <!-- Warning/Alert Icon -->
    <mat-icon
        [class]="'mr-2 ' + (isUrgent ? 'text-red-600 dark:text-red-400' : 'text-amber-600 dark:text-amber-400')"
        [svgIcon]="isUrgent ? 'heroicons_outline:exclamation-circle' : 'heroicons_outline:exclamation-triangle'">
    </mat-icon>

    <!-- Banner Text -->
    <span [class]="'text-sm font-medium ' + (isUrgent ? 'text-red-800 dark:text-red-200' : 'text-amber-800 dark:text-amber-200')">
        {{ bannerText }}
    </span>
</div>
