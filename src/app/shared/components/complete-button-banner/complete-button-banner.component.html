<!-- Complete Button Banner -->
<div class="flex items-center px-3 py-1.5 rounded-lg shadow-sm bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 hover:opacity-80 transition-opacity">
    <button
        mat-raised-button
        color="primary"
        class="text-xs"
        [disabled]="sending"
        (click)="sendTestMessage()">
        <mat-icon class="icon-size-4 mr-1">send</mat-icon>
        <span>{{ sending ? 'Enviando...' : 'Completar' }}</span>
    </button>
</div>
