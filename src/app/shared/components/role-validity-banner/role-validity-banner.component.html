@if (showBanner && user) {
<div class="flex items-center justify-center gap-3 px-4 py-2 text-sm bg-amber-100 dark:bg-amber-900/30 text-amber-800 dark:text-amber-200 border-b border-amber-200 dark:border-amber-800">
  <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:clock'"></mat-icon>
  <span>{{ 'roleExtension.banner.message' | transloco: { date: roleValidToFormatted } }}</span>
  <button mat-stroked-button color="primary" (click)="openRequestExtensionModal()">
    {{ 'roleExtension.banner.requestExtension' | transloco }}
  </button>
</div>
}
