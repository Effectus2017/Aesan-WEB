<!-- Current Program Banner -->
<div
    *ngIf="showBanner"
    class="flex items-center px-3 py-1.5 rounded-lg shadow-sm bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800"
    [matTooltip]="tooltipText"
    matTooltipPosition="below">

    <!-- Program Icon -->
    <mat-icon
        class="mr-2 text-blue-600 dark:text-blue-400"
        [svgIcon]="programIcon">
    </mat-icon>

    <!-- Banner Text -->
    <span class="text-sm font-medium text-blue-800 dark:text-blue-200">
        {{ bannerText }}
    </span>
</div>
