<!-- Agency Code Banner -->
<div
    *ngIf="showBanner"
    class="flex items-center px-3 py-1.5 rounded-lg shadow-sm bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800">

    <!-- Code Icon -->
    <mat-icon
        class="mr-2 text-green-600 dark:text-green-400"
        [svgIcon]="codeIcon"
        [matTooltip]="tooltipText"
        matTooltipPosition="below">
    </mat-icon>

    <!-- Banner Text -->
    <span class="text-sm font-medium text-green-800 dark:text-green-200">
        {{ bannerText }}
    </span>
</div>
