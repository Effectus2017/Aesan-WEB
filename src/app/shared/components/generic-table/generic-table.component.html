<table class="w-full" mat-table [dataSource]="config.dataSource" [trackBy]="trackByFn">
  <ng-container [matColumnDef]="col.key" *ngFor="let col of config.columnsSchema">
    <th mat-header-cell *matHeaderCellDef>
      {{ col.label | transloco }}
    </th>
    <td mat-cell *matCellDef="let element">
      <div [ngSwitch]="col.type">
        <span *ngIf="col.type === 'check'">
          <mat-checkbox [(ngModel)]="element[col.key]" (change)="onCheckChange($event, element)">
          </mat-checkbox>
        </span>
        <span *ngIf="col.type === 'date'">
          {{ element[col.key] | date : "yyyy-MM-dd" }}
        </span>
        <span *ngIf="col.type === 'text'">
          {{ element[col.key] }}
        </span>
        <span *ngIf="col.type === 'number'">
          {{ element[col.key] }}
        </span>
        <span *ngIf="col.type === 'boolean'">
          {{ element[col.key] ? "Si" : "No" }}
        </span>
        <span *ngSwitchCase="'button'" class="flex flex-row justify-center gap-2">
          <div *ngFor="let button of col?.buttons">
            <button [title]="button.label | transloco" *ngIf="button.key === 'edit'" type="button" mat-icon-button color="warm" (click)="onEdit($event, element.id)">
              <mat-icon [svgIcon]="'mat_solid:launch'"></mat-icon>
            </button>
            <button [title]="button.label | transloco" *ngIf="button.key === 'delete'" type="button" mat-icon-button color="warm" (click)="onDelete($event, element.id)">
              <mat-icon [svgIcon]="'mat_solid:delete'"></mat-icon>
            </button>
          </div>
        </span>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="config.displayedColumns"></tr>
  <tr class="h-16 order-row" mat-row *matRowDef="let row; columns: config.displayedColumns"></tr>
</table>
